<gems-form-card
  title="Dados"
  subtitle="Identificação do parceiro e identidade civil."
  icon="fa-solid fa-id-card"
>
  <form [formGroup]="formGroup" class="form-grid">
    <div class="form-group full-width">
      <gems-input-text
        formControlName="nome"
        label="Nome do parceiro"
        [required]="true"
        placeholder="Como o parceiro é chamado no dia a dia"
        icon="fa-solid fa-handshake"
        [maxlength]="255"
      ></gems-input-text>
      <gems-field-error [control]="formGroup.get('nome')" [messages]="erroNome"></gems-field-error>
    </div>

    @if (podeVerComissao) {
      <div class="form-group">
        <gems-input-text
          formControlName="comissao"
          label="Comissão (%)"
          type="number"
          placeholder="Ex.: 12,50"
          icon="fa-solid fa-percent"
        ></gems-input-text>
        <gems-field-error
          [control]="formGroup.get('comissao')"
          [messages]="erroComissao"
        ></gems-field-error>
      </div>
    }

    <div class="form-group full-width">
      <gems-textarea
        formControlName="descricao"
        label="Descrição"
        placeholder="Observações sobre a atuação do parceiro"
        [rows]="4"
        [maxlength]="4000"
      ></gems-textarea>
    </div>
  </form>

  <app-dados-pessoais-fields
    [form]="dadosPessoais"
    [isReadOnly]="isReadOnly()"
  ></app-dados-pessoais-fields>

  <div gems-form-card-footer class="step-actions">
    <button type="button" class="btn-cancel" (click)="goBack()">
      <i class="fa-solid fa-xmark"></i>
      Cancelar
    </button>
    <button type="button" class="btn-save" (click)="avancar()">
      Avançar
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</gems-form-card>
